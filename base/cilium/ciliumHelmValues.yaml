ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - ${POD_CIDR}

kubeProxyReplacement: true

# Allow Cilium to run on controlplane nodes
tolerations:
  - operator: Exists
  - key: nidhogg.uswitch.com/spegel.spegel
    operator: Exists
    effect: NoSchedule
  
securityContext:
  capabilities:
    ciliumAgent:
      - CAP_NET_BIND_SERVICE
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: "127.0.0.1"
k8sServicePort: 7445

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
  wireguard:
    persistentKeepalive: 5s

# Explicitly set MTU to account for WireGuard IPv4 overhead (~76 bytes).
# KubeVirt masquerade VMs read interface MTU (not route MTU) when advertising
# TCP MSS, so without this, large packets from VMs can exceed the wire MTU
# on inter-node WireGuard tunnels, causing hung connections for large transfers.
# 1500 (physical) - 76 (WireGuard IPv4 overhead) = 1424
MTU: 1424

l2announcements:
  enabled: ${CILIUM_L2_ANNOUNCEMENTS_ENABLED}

externalIPs:
  enabled: true

ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared


#Needed or else ArgoCD will show resources as OutOfSync permanently
hubble:
  peerService:
    servicePort: 443
  ui:
    enabled: true
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    ingress:
      enabled: true
      className: traefik
      hosts:
        - hubble.${CLUSTER_EXTERNAL_DOMAIN}
      tls:
        - secretName: hubble-ui-tls
          hosts:
            - hubble.${CLUSTER_EXTERNAL_DOMAIN}
      annotations:
        cert-manager.io/cluster-issuer: ${TALOS_CLUSTER_NAME}-ca-issuer
        traefik.ingress.kubernetes.io/router.middlewares: kube-system-hubble-ui-auth@kubernetescrd
  relay:
    enabled: true
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  tls: #https://docs.cilium.io/en/latest/observability/hubble/configuration/tls/
    auto: # https://docs.cilium.io/en/latest/configuration/argocd-issues/#argo-cd-show-resources-permanently-out-of-sync
      enabled: true
      method: certmanager
      certValidityDuration: 60 #Days
      certManagerIssuerRef:
        name: ${TALOS_CLUSTER_NAME}-ca-issuer
        kind: ClusterIssuer