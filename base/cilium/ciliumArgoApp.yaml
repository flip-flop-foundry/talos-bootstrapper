apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: kube-system
  # labels:
  #   initial-deploy-with-kubectl: "true"
  annotations:
      argocd.argoproj.io/sync-wave: "-50"
spec:
  project: cluster-services
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  ignoreDifferences:
    # Cilium mutates generated EndpointSlices by adding endpoint conditions at runtime.
    # Ignore that controller-owned field so the Application does not stay OutOfSync.
    - group: discovery.k8s.io
      kind: EndpointSlice
      jqPathExpressions:
        - .endpoints[]?.conditions
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 10m
  sources:
    - chart: cilium
      repoURL: https://helm.cilium.io/
      targetRevision: ${CILIUM_HELM_VERSION}
      helm:
        releaseName: cilium
        valueFiles:
          - $values/_rendered/cilium/ciliumHelmValues.yaml
    - repoURL: ${GITEA_CLUSTER_SERVICES_REPO_URL}
      targetRevision: ${GITEA_CLUSTER_SERVICES_REPO_BRANCH}
      path: _rendered/cilium
      ref: values
      directory:
        recurse: false
        exclude: "{ciliumHelmValues.yaml,ciliumArgoApp.yaml}"
