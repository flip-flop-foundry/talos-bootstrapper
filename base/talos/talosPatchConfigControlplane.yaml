# Controlplane-specific patch for Talos configuration
# Enables Talos API access from Kubernetes pods in longhorn-system and kube-system namespaces
# Mainly used to allow the disk detection logic to access the Talos API to detect disks and make them available to Longhorn
# Environments that need more (e.g. KIPR) override this document by kind; their lists replace these,
# so they must repeat every namespace and role they still need.
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:reader
allowedKubernetesNamespaces:
  - longhorn-system
  - kube-system
---
# Cilium replaces kube-proxy
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Cilium is the CNI; without this document Talos deploys no CNI
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
