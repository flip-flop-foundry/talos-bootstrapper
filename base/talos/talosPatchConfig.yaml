version: v1alpha1
machine:
  # Kept in the deprecated v1alpha1 .machine.kubelet on purpose: Talos 1.14's KubeletConfig
  # document has NO equivalent of extraMounts, which Longhorn needs for /var/lib/longhorn.
  # The two are mutually exclusive, so the generated KubeletConfig is deleted below and its
  # image/seccomp/manifests settings are carried here instead.
  # https://github.com/siderolabs/talos/issues/14365 (closed: no replacement planned)
  # https://github.com/siderolabs/talos/issues/14411 (open: keep /var/lib mounts on 1.14)
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v${KUBERNETES_VERSION}
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraMounts:
      - destination: /var/lib/longhorn #https://longhorn.io/docs/1.11.0/advanced-resources/os-distro-specific/talos-linux-support/#data-path-mounts
        source: /var/lib/longhorn
        type: bind
        options:
          - bind
          - rw
          - rshared
    extraConfig:
      serverTLSBootstrap: true
  certSANs: 
    - "$TALOS_CLUSTER_ENDPOINT"
  kernel: 
    modules:
      - name: nvme_tcp
      - name: vfio_pci
  sysctls:
    vm.nr_hugepages: "1024"
    user.max_user_namespaces: "11255" #Enable user namespaces support, https://docs.siderolabs.com/kubernetes-guides/security/usernamespace
  # Required for Spegel on Talos — https://spegel.dev/docs/getting-started/#talos
  # Talos enables discard_unpacked_layers by default, which prevents Spegel from
  # serving cached image layers to peers. This must be disabled explicitly.
  # Spegel itself writes per-registry mirror configs to /etc/cri/conf.d/hosts.
  #
  # device_ownership_from_security_context — required for KubeVirt/CDI Block volume imports.
  # Without this, containerd creates block device nodes as root:root 0660; non-root CDI
  # importer pods cannot open /dev/cdi-block-volume and fail immediately with EACCES.
  # See base/kubevirt/README.md for full diagnosis.
  files:
    - path: /etc/cri/conf.d/20-customization.part
      permissions: 0o644
      op: create
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false

        [plugins."io.containerd.cri.v1.runtime"]
          device_ownership_from_security_context = true
---
apiVersion: v1alpha1
kind: KubeletConfig
$patch: delete
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  forwardKubeDNSToHost: false
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - "$POD_CIDR"
serviceSubnets:
  - "$SERVICE_CIDR"
