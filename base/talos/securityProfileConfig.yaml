# Talos 1.14+ only. Pins workload isolation explicitly instead of relying on the
# default, which differs between new clusters (talosctl gen config emits true) and
# upgraded ones (document absent, which Talos reads as false).
#
# Always false: every cluster runs Longhorn, whose host-namespace lookup is unverified
# under sandboxd. See base/talos/README.md.
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false
