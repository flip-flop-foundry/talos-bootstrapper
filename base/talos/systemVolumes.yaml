apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  # Lets fstrim reach the backing device through the LUKS mapping. The trade is that
  # the device then sees which blocks the filesystem considers free.
  allowDiscards: true
  keys:
    - slot: 0
      kms:
        endpoint: ${TALOS_DISK_ENCRYPTION_KMS_URL}
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  allowDiscards: true
  keys:
    - slot: 0
      kms:
        endpoint: ${TALOS_DISK_ENCRYPTION_KMS_URL}