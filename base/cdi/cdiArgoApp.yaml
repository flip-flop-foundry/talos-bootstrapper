apiVersion: v1
kind: Namespace
metadata:
  name: ${CDI_NAMESPACE}
  labels:
    initial-deploy-with-kubectl: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdi
  namespace: ${CDI_NAMESPACE}
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: cluster-services
  destination:
    namespace: ${CDI_NAMESPACE}
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 10m
  ignoreDifferences: #  The CDI operator controller owns and mutates its own CRDs after install — it removes the deprecated v1alpha1 
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/versions
  sources:
    - repoURL: ${GITEA_CLUSTER_SERVICES_REPO_URL}
      targetRevision: ${GITEA_CLUSTER_SERVICES_REPO_BRANCH}
      path: _rendered/cdi
