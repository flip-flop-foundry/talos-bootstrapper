apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: ${ARGOCD_NAMESPACE}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    bootstrapper.talos.dev/required-before-argo-hook: deploymentHooks/beforeArgo/20-gateway-api-migration.sh
spec:
  project: cluster-services
  destination:
    server: https://kubernetes.default.svc
    namespace: ${ARGOCD_NAMESPACE}
  source:
    # Upstream standard-channel bundle (same content as the release's standard-install.yaml).
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: ${GATEWAY_API_VERSION}
    path: config/crd
    kustomize:
      commonAnnotations:
        # Never prune/delete Gateway API CRDs automatically: that would delete every Gateway/route.
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
