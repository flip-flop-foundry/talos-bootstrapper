###############################################################################
# Storage-encryption key bootstrap for the Coder CNPG cluster
#
# The nssharedkey-* Longhorn storage class used by the CNPG cluster requires a
# per-namespace secret `luks-ns-shared-key` (key CRYPTO_KEY_VALUE). This PreSync
# Job generates it once if absent; it is never stored in Git.
#
# As a PreSync hook it runs before the Application's main sync, so the key exists
# before the CNPG cluster provisions its encrypted PVCs, avoiding a Pending-PVC window.
###############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-cnpg-secrets-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-cnpg-secrets-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # Least-privilege: only ever read/patch the one secret this Job manages.
  # (create cannot be constrained by resourceNames, so it is a separate rule.)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["luks-ns-shared-key"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-cnpg-secrets-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-cnpg-secrets-bootstrap
subjects:
  - kind: ServiceAccount
    name: coder-cnpg-secrets-bootstrap
    namespace: ${CODER_NAMESPACE}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-cnpg-secrets-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    metadata:
      name: coder-cnpg-secrets-bootstrap
    spec:
      serviceAccountName: coder-cnpg-secrets-bootstrap
      automountServiceAccountToken: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets-bootstrap
          image: alpine/k8s:${KUBERNETES_VERSION}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              NAMESPACE="${CODER_NAMESPACE}"

              # Generate a secure random string suitable for a LUKS key
              generate_secure_key() {
                head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 43
              }

              # Create a secret only if it does not already exist (idempotent)
              create_secret_if_not_exists() {
                secret_name="$1"
                secret_type="$2"
                shift 2

                echo "Checking if secret ${secret_name} exists in namespace ${NAMESPACE}..."
                if kubectl get secret "${secret_name}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                  echo "  Secret ${secret_name} already exists. Skipping creation."
                  return 0
                fi

                echo "  Creating secret ${secret_name}..."
                cmd="kubectl create secret generic '${secret_name}' -n '${NAMESPACE}' --type='${secret_type}'"
                while [ "$#" -gt 0 ]; do
                  entry="$1"; shift
                  key="${entry%%:*}"; value="${entry#*:}"
                  cmd="${cmd} --from-literal=${key}=${value}"
                done
                eval "$cmd"
                echo "  Secret ${secret_name} created successfully."
              }

              # Storage-encryption key for the nssharedkey-* Longhorn storage class
              create_secret_if_not_exists "luks-ns-shared-key" "Opaque" \
                CRYPTO_KEY_VALUE:"$(generate_secure_key)"

              echo "Coder CNPG bootstrap secret created/verified successfully."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
