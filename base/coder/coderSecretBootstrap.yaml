###############################################################################
# Admin-populated secret shells
#
# These Secrets are declared here with NO data so that Git never contains
# credentials. An admin fills in the keys after deploy (see README.md). The
# ServerSideApply + IgnoreExtraneous options ensure ArgoCD never wipes the
# admin-provided values and never reports the populated secret as OutOfSync.
###############################################################################
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-oidc
  namespace: ${CODER_NAMESPACE}
  annotations:
    # Auto-populated by gitea-bootstrap.sh, which creates a Gitea OAuth2 app and
    # writes its client-id/client-secret here. Shell declared so the secret always
    # exists; ServerSideApply + IgnoreExtraneous preserve the runtime-written keys.
    # Keys: client-id, client-secret
    kubernetes.io/description: "Gitea OIDC app credentials for Coder login, auto-populated by gitea-bootstrap.sh (client-id, client-secret)."
    argocd.argoproj.io/sync-options: ServerSideApply=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-external-auth
  namespace: ${CODER_NAMESPACE}
  annotations:
    # Auto-populated by gitea-bootstrap.sh, which creates a Gitea OAuth2 app for
    # workspace git external-auth and writes its client-id/client-secret here.
    # Keys: client-id, client-secret
    kubernetes.io/description: "Gitea external-auth app credentials for Coder workspace git, auto-populated by gitea-bootstrap.sh (client-id, client-secret)."
    argocd.argoproj.io/sync-options: ServerSideApply=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-owner-bootstrap
  namespace: ${CODER_NAMESPACE}
  annotations:
    # Auto-populated by the coderOwnerBootstrapJob PostSync hook, which seeds the
    # first Coder owner (username=admin, email=admin@${CODER_DOMAIN_NAME}) with a
    # randomly generated password and writes it back here. Retrieve with:
    #   kubectl -n ${CODER_NAMESPACE} get secret coder-owner-bootstrap \
    #     -o jsonpath='{.data.password}' | base64 -d
    # Keys (filled in after first sync): email, username, password
    kubernetes.io/description: "Coder owner credentials, auto-populated by coderOwnerBootstrapJob (email, username, password)."
    argocd.argoproj.io/sync-options: ServerSideApply=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
