---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syncthing-secrets-bootstrap
  namespace: ${SYNCTHING_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: syncthing-secrets-bootstrap
  namespace: ${SYNCTHING_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: syncthing-secrets-bootstrap
  namespace: ${SYNCTHING_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: syncthing-secrets-bootstrap
subjects:
  - kind: ServiceAccount
    name: syncthing-secrets-bootstrap
    namespace: ${SYNCTHING_NAMESPACE}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: syncthing-secrets-bootstrap
  namespace: ${SYNCTHING_NAMESPACE}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    metadata:
      name: syncthing-secrets-bootstrap
    spec:
      serviceAccountName: syncthing-secrets-bootstrap
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets-bootstrap
          image: alpine/k8s:${KUBERNETES_VERSION}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              
              NAMESPACE="${SYNCTHING_NAMESPACE}"
              
              # Function to generate a secure random LUKS encryption key
              generate_secure_key() {
                head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 43
              }
              
              # Helper function to create a secret if it doesn't exist
              create_secret_if_not_exists() {
                secret_name="$1"
                secret_type="$2"
                shift 2
                
                echo "Checking if secret ${secret_name} exists in namespace ${NAMESPACE}..."
                
                if kubectl get secret "${secret_name}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                  echo "  ✓ Secret ${secret_name} already exists. Skipping creation."
                  return 0
                fi
                
                echo "  Creating secret ${secret_name}..."
                
                # Build kubectl create secret command
                cmd="kubectl create secret generic '${secret_name}' -n '${NAMESPACE}' --type='${secret_type}'"
                
                while [ "$#" -gt 0 ]; do
                  entry="$1"
                  shift
                  key="${entry%%:*}"
                  value="${entry#*:}"
                  cmd="${cmd} --from-literal=${key}=${value}"
                done
                
                eval "$cmd"
                
                echo "  ✓ Secret ${secret_name} created successfully!"
              }
              
              # Create LUKS encryption key secret for config PVC
              # Secret name must match the PVC name for pvckey storage class
              create_secret_if_not_exists "config-syncthing-0" "Opaque" \
                CRYPTO_KEY_VALUE:"$(generate_secure_key)"
              
              # Create LUKS encryption key secret for data PVC
              # Secret name must match the PVC name for pvckey storage class
              create_secret_if_not_exists "data-syncthing-0" "Opaque" \
                CRYPTO_KEY_VALUE:"$(generate_secure_key)"
              
              echo "All Syncthing LUKS encryption key secrets have been created/verified successfully!"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
