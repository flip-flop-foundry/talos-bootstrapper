apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  # The upstream KubeVirt operator manifests use the default `kubevirt` namespace.
  # Keep this CR in the same namespace unless the operator manifests are also rewritten.
  namespace: kubevirt
  annotations:
    argocd.argoproj.io/sync-wave: "2" # Deploy after operator CRDs are available
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - LiveMigration
        - Snapshot
        - VMExport
        - ExpandDisks
        - HotplugVolumes
    network:
      defaultNetworkInterface: masquerade
    migrations:
      # Keep migrations reliable by default; permit auto-converge but not post-copy.
      parallelMigrationsPerCluster: 5
      parallelOutboundMigrationsPerNode: 2
      bandwidthPerMigration: 64Mi
      completionTimeoutPerGiB: 800
      progressTimeout: 150
      allowAutoConverge: true
      allowPostCopy: false
      allowWorkloadDisruption: false
      unsafeMigrationOverride: false
  infra:
    nodePlacement:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
  workloads:
    nodePlacement:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
