---
# customer-apps ApplicationSet
#
# Uses a Matrix generator to automatically discover and deploy all customer
# application repositories:
#
#   Child 1 — Git file generator
#     Reads  customers/*/<name>.yaml  from the cluster-services repo.
#     Each file is a customer descriptor that provides gitea.orgName and
#     customerName parameters to child 2.
#
#   Child 2 — SCM provider generator (Gitea)
#     Uses {{.gitea.orgName}} from child 1 to scan that Gitea org for repos
#     that contain a  deploy/  directory.
#
# Adding a new customer requires only:
#   1. Running bootstrap-customer.sh (which commits the descriptor and creates
#      the AppProject).
#   2. The ApplicationSet picks up the new descriptor on the next poll (~3 min)
#      and creates Applications for every matching repo in that customer's org.
#
# Required environment variables (set in <cluster>.env):
#   GITEA_DOMAIN_NAME                  e.g. gitea.tuborgnetes.dk
#   GITEA_CLUSTER_SERVICES_REPO_URL    e.g. https://gitea.tuborgnetes.dk/k8s-cluster/cluster-services.git
#   ARGOCD_NAMESPACE                   e.g. argocd
#   CUSTOMERS_ARGOCD_SCM_SECRET        k8s secret name in ARGOCD_NAMESPACE
#                                      key: "token"  value: Gitea token for
#                                      argocd-cluster-services with scopes
#                                      read:organization,read:repository,read:user
#
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: customer-apps
  namespace: ${ARGOCD_NAMESPACE}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          # ----------------------------------------------------------------
          # Child 1: read every customers/*/<name>.yaml from cluster-services
          # ----------------------------------------------------------------
          - git:
              repoURL: ${GITEA_CLUSTER_SERVICES_REPO_URL}
              revision: HEAD
              files:
                - path: "customers/*/*.yaml"
              # Prefix all path.* params so they don't clash with the SCM
              # provider params from child 2 (required when both children are
              # generators that produce path-related keys).
              pathParamPrefix: customer

          # ----------------------------------------------------------------
          # Child 2: scan the customer's Gitea org for repos with deploy/
          # The owner: field is parameterised from child 1's output.
          # ----------------------------------------------------------------
          - scmProvider:
              gitea:
                owner: "{{.gitea.orgName}}"
                api: https://${GITEA_DOMAIN_NAME}
                insecure: false
                allBranches: false
                tokenRef:
                  secretName: ${CUSTOMERS_ARGOCD_SCM_SECRET}
                  key: token
              filters:
                - pathsExist:
                    - deploy

  template:
    metadata:
      # Application name is globally unique: customer-<name>-<repo>
      name: "customer-{{.customerName}}-{{.repository}}"
      labels:
        customer-app: "true"
        customer-name: "{{.customerName}}"
        customer-org: "{{.gitea.orgName}}"

    spec:
      # One AppProject per customer — created by bootstrap-customer.sh.
      # It restricts deployments to {{.gitea.orgName}}-* namespaces and source
      # repos to {{.gitea.orgName}}/* only.
      project: "customer-{{.customerName}}"

      source:
        # Use HTTPS URL explicitly so it matches the AppProject's sourceRepos
        # allowlist (https://gitea.../orgName/*). The SCM provider returns an
        # SSH url in {{.url}} which would be rejected by the AppProject.
        repoURL: "https://${GITEA_DOMAIN_NAME}/{{.gitea.orgName}}/{{.repository}}.git"
        targetRevision: "{{.branch}}"
        path: deploy

      destination:
        server: https://kubernetes.default.svc
        # Namespace = <orgName>-<repoName> to prevent collisions between
        # customers who both name a repo "app".
        namespace: "{{.gitea.orgName}}-{{.repository}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
